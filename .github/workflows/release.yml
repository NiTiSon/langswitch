name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup LLVM
        uses: aminya/setup-cpp@v1
        with:
          compiler: llvm

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Upload Application
        uses: softprops/action-gh-release@v3
        with:
          files: |
            install.ps1
            langswitch.exe
